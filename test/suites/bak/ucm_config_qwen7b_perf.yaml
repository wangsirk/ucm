# UCM Configuration for Qwen2.5-7B Performance Testing
# 
# Qwen2.5-7B 性能测试专用KVCache配置 - Posix存储后端
# 
# 使用方法：
#   方式1: 通过环境变量指定配置文件
#     export UCM_CONFIG_FILE=/path/to/ucm_config_qwen7b_perf.yaml
#   
#   方式2: 在代码中指定
#     kv_connector_extra_config={"UCM_CONFIG_FILE": "/path/to/ucm_config_qwen7b_perf.yaml"}

# Connector配置
ucm_connectors:
  - ucm_connector_name: "UcmPipelineStore"
    ucm_connector_config:
      # 存储管道类型: Posix (适用于本地磁盘/Lustre客户端)
      store_pipeline: "Posix"
      
      # 存储后端路径列表
      # 性能测试时使用专用目录
      storage_backends:
        - "/home/w2938/test/ucm_kvcache_perf"
      
      # IO模式配置
      # io_direct: false - 使用缓冲IO (推荐用于Lustre)
      # io_direct: true  - 使用直IO (适用于大块数据)
      io_direct: false
      
      # 并发配置 - 针对高并发场景优化
      # posix_data_trans_concurrency: 数据传输并发数
      # posix_lookup_concurrency: 查找操作并发数
      posix_data_trans_concurrency: 32
      posix_lookup_concurrency: 32
      
      # 块大小配置 (可选，通常使用默认值)
      # block_size: 1048576  # 1MB

# 可选: 启用UCM指标监控
# metrics_config_path: "/home/w2938/unified-cache-management/examples/metrics/metrics_configs.yaml"

# 可选: 稀疏注意力配置 (用于长文本场景，如32K输入)
# ucm_sparse_config:
#   ESA:
#     init_window_sz: 1
#     local_window_sz: 2
#     min_blocks: 4
#     sparse_ratio: 0.3
#     retrieval_stride: 5

# 可选: 层级加载/保存配置
# use_layerwise: true
# hit_ratio: 0.98
